<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PulseWatch mark">
  <defs>
    <linearGradient id="pw-pulse" x1="8" y1="32" x2="56" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F97316"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
  </defs>
  <!-- radar rings -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#F97316" stroke-opacity="0.22" stroke-width="2"/>
  <circle cx="32" cy="32" r="18" fill="none" stroke="#F97316" stroke-opacity="0.38" stroke-width="2"/>
  <circle cx="32" cy="32" r="10" fill="none" stroke="#F97316" stroke-opacity="0.55" stroke-width="2"/>
  <!-- monitoring beam -->
  <path d="M32 32 L52 16" stroke="#F97316" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85"/>
  <!-- pulse / conversation waveform -->
  <path d="M12 34 H20 L24 22 L30 42 L36 28 L40 34 H52" fill="none" stroke="url(#pw-pulse)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- signal core -->
  <circle cx="32" cy="32" r="3.5" fill="#F97316"/>
</svg>
